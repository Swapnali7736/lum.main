<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* all p*/
        p {
            color: yellow;
        }
        /*elements with id i*/
        #i {
            color: red;
        }
        /*elements with class p*/
        .p {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1 id="i">Class And Id</h1>
    <p>para1</p>
    <p class="p">para2</p>
    <p>para3</p>
    <p class="p">para4</p>
</body>

</html>
