<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>ordered list</h1>
    <ol type="a">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
    </ol>

    <h1>unordered list</h1>
    <ul type="square">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
    </ul>

    <h1>description list</h1>
    <dl>
        <dt>item1</dt>
        <dd>description</dd>
        <dt>item2</dt>
        <dd>description</dd>
    </dl>
</body>

</html>
