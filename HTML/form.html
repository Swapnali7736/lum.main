<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>Add User Details</h3>

    <form>
        <label>Username</label>
        <input type="text">
        <br>
        <br>
        <br>
        <label>Password</label>
        <input type="password">
        <br>
        <br>
        <br>
        <label>DOB</label>
        <input type="date">
        <br>
        <br>
        <br>
        <label>E-mail</label>
        <input type="email">
        <br>
        <br>
        <br>
        <label>Age</label>
        <input type="number">
        <br>
        <br>
        <br>
        <label>Address</label>
        <textarea rows="10" cols="20">
        Write your address here....
        </textarea>
        <br>
        <br>
        <br>
        <label>Qualifications</label>
        <select>
            <option>BBA</option>
            <option>BCA</option>
            <option>BTECH</option>
            <option>MTECH</option>
        </select>
        <br>
        <br>
        <br>
        <label>Gender:</label>
        <input type="radio" name="g">male
        <input type="radio" name="g">female

        <br>
        <br>
        <br>
        <label>Areas of Interest</label><br>
        <input type="checkbox">Sports<br>
        <input type="checkbox">Music<br>
        <input type="checkbox">Travel</br>
        <br>
        <br>
        <br>
        <label>Send CV</label><br>
        <input type="file">
        
        <br>
        <br>
        
        <input type="submit" value="Register">
        <input type="reset" value="Start Again">

        <!-- or
        <button type="submit"></button> -->
    </form>
</body>

</html>
