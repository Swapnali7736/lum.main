<!DOCTYPE html>

<html lang="en">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Form</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    ```

</head>

<body class="bg-secondary">


    <div class="container w-50 mt-5">

        <form>

            <!-- Username -->
            <div class="mt-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Username">
            </div>

            <!-- Password -->
            <div class="mt-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control">
            </div>

            <!-- Address -->
            <div class="mt-3">
                <label class="form-label">Address</label>
                <textarea rows="5" class="form-control" placeholder="Write your address here"></textarea>
            </div>

            <!-- Hobbies -->
            <div class="mt-3">

                <label class="form-label">Hobbies</label><br>

                <div class="form-check form-check-inline">

                    <input class="form-check-input" type="checkbox" id="sports">

                    <label class="form-check-label" for="sports">Sports</label>

                </div>

                <div class="form-check form-check-inline">

                    <input class="form-check-input" type="checkbox" id="music">

                    <label class="form-check-label" for="music">Music</label>

                </div>

                <div class="form-check form-check-inline">

                    <input class="form-check-input" type="checkbox" id="travel">

                    <label class="form-check-label" for="travel">Travel</label>

                </div>

            </div>

            <!-- Gender -->
            <div class="mt-3">

                <label class="form-label">Gender</label><br>

                <div class="form-check form-check-inline">

                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="male" value="male">

                    <label class="form-check-label" for="male">Male</label>

                </div>

                <div class="form-check form-check-inline">

                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="female" value="female">

                    <label class="form-check-label" for="female">Female</label>

                </div>

            </div>

            <!-- Qualifications -->
            <div class="mt-3">

                <label class="form-label">Qualifications</label>

                <select class="form-select">

                    <option selected>Open this select menu</option>
                    <option value="1">BBA</option>
                    <option value="2">BCA</option>
                    <option value="3">BTECH</option>
                    <option value="4">MTECH</option>

                </select>

            </div>

            <!-- Submit -->
            <div class="mt-4">

                <input type="submit" value="Submit" class="btn btn-primary">

            </div>

        </form>

    </div>
    
    <h1 class="text-center">Images</h1>
    <img src="starry.jpeg" class="img-thumbnail"><br><br>
    <img src="starry.jpeg" class="rounded rounded-4"><br><br>

<div class="row">
    <div class="col-2 bg-primary">column1</div>
    <div class="col-4 bg-danger">column1</div>
    <div class="col-6 bg-success">column1</div>

</div>
</body>

</html>
