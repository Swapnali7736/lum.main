<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            border: 2px solid red;
            width: 400px;
            height: 200px;
            position: relative;      
          }
          .child{
            position: absolute;
            right: 10px;
            top: 100px;
            border: 2px solid green;
            width: 200px;
            height: 100px;
          }
    </style>
</head>
<body>
    <h1>Position - absolute</h1>
    <div class="parent">
        <div class="child">

        
        hello
    </div>

</body>
</html>
